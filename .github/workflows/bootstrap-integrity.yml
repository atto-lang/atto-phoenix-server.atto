# Unreviewed PRs must never execute private source on persistent runners.
name: AttoLang Phoenix HTTP source integrity
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind checked-out source to exact head
        shell: bash
        env:
          EXPECTED_DEMO_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_DEMO_SHA"
          printf 'demo_head=%s\n' "$(git rev-parse HEAD)"
          printf 'demo_tree=%s\n' "$(git rev-parse HEAD^{tree})"
      - name: Source and oracle integrity (no guest execution)
        shell: bash
        run: |
          set -euo pipefail
          for script in ci/*.sh scripts/run-contracts.sh; do bash -n "$script"; done
          bash ci/check-native-abi.sh
          bash ci/test-native-abi.sh
          bash ci/check-fixtures.sh
          bash ci/test-fixtures.sh
          bash ci/test-source-policy.sh
          bash ci/source-policy.sh
          test "$(cat SOURCE_REF)" = "6d8eb70048eafc9a84c5aebe9c1bb06104f16e76"
          grep -Fxq 'execution=pending-exact-head' demo-status.txt
          echo 'HOST_STRUCTURAL_ONLY: AttoLang compiler/guest NOT_EXECUTED'
